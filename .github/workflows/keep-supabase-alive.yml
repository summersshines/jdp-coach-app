name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "Supabase responded: %{http_code}\n" \
            "https://dejmkfbzbqtvqgxtwipv.supabase.co/rest/v1/jdp_data?select=key&limit=1" \
            -H "apikey: sb_publishable_zLIVnPYNxlyyAsYrkq9LJg_ztRZaJFp" \
            -H "Authorization: Bearer sb_publishable_zLIVnPYNxlyyAsYrkq9LJg_ztRZaJFp"

      - name: Record ping timestamp
        run: |
          mkdir -p .github
          date -u "+%Y-%m-%d %H:%M UTC" > .github/last-ping.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-ping.txt
          git diff --cached --quiet || git commit -m "chore: keep-alive ping"
          git push
